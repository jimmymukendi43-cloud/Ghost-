<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ghost Music</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    :root {
      --green: #1DB954;
      --bg: #0a0a0a;
      --surface: #141414;
      --surface2: #1e1e1e;
      --surface3: #282828;
      --text: #fff;
      --text2: #b3b3b3;
      --text3: #6a6a6a;
      --nav-h: 60px;
      --player-h: 72px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      width: 100vw;
    }

    /* ── DYNAMIC BACKGROUND ── */
    #bg-blur {
      position: fixed; inset: 0; z-index: 0;
      background-size: cover; background-position: center;
      filter: blur(80px) brightness(0.25) saturate(1.5);
      transform: scale(1.2);
      transition: background-image 1s ease;
      background-color: #1a1a2e;
    }

    /* ── APP SHELL ── */
    #app {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      height: 100vh; max-width: 480px; margin: 0 auto;
    }

    /* ── SCROLLABLE CONTENT ── */
    #content {
      flex: 1; overflow-y: auto;
      scrollbar-width: none;
      padding-bottom: 10px;
    }
    #content::-webkit-scrollbar { display: none; }

    /* ════════════════════════
       HOME PAGE
    ════════════════════════ */
    #home-page { padding: 0 16px; }

    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 52px 0 20px;
    }
    .top-bar .greeting { font-size: 22px; font-weight: 800; }

    .avatar-btn {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--green); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: #000;
    }

    /* Chips */
    .chips { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
    .chip {
      background: var(--surface3); border: none; color: var(--text);
      padding: 8px 16px; border-radius: 20px; font-size: 13px;
      font-weight: 600; cursor: pointer; font-family: inherit;
      transition: background .15s;
    }
    .chip.active { background: var(--green); color: #000; }
    .chip:active { opacity: .75; }

    /* Quick picks row */
    .quick-picks {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px; margin-bottom: 28px;
    }
    .quick-pick {
      background: var(--surface3); border-radius: 6px;
      display: flex; align-items: center; gap: 12px;
      overflow: hidden; cursor: pointer; transition: background .15s;
      height: 56px;
    }
    .quick-pick:active { background: #3a3a3a; }
    .quick-pick img { width: 56px; height: 56px; object-fit: cover; flex-shrink: 0; }
    .quick-pick-title {
      font-size: 13px; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      padding-right: 8px;
    }

    /* Section headers */
    .section-header {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 14px;
    }
    .section-title { font-size: 18px; font-weight: 800; }
    .section-more { font-size: 12px; font-weight: 600; color: var(--text2); }

    /* Horizontal scroll cards */
    .h-scroll {
      display: flex; gap: 14px; overflow-x: auto; margin: 0 -16px;
      padding: 0 16px 12px; scrollbar-width: none;
    }
    .h-scroll::-webkit-scrollbar { display: none; }

    .music-card {
      flex-shrink: 0; width: 140px; cursor: pointer;
    }
    .music-card img {
      width: 140px; height: 140px; border-radius: 8px;
      object-fit: cover; display: block; margin-bottom: 8px;
      background: var(--surface3);
    }
    .music-card .card-title {
      font-size: 13px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .music-card .card-artist {
      font-size: 12px; color: var(--text2); margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ════════════════════════
       SEARCH PAGE
    ════════════════════════ */
    #search-page { padding: 0 16px; display: none; }

    .search-top { padding: 52px 0 20px; }
    .search-top h2 { font-size: 22px; font-weight: 800; margin-bottom: 16px; }

    .search-field {
      position: relative; margin-bottom: 20px;
    }
    .search-field svg {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      fill: var(--text3); pointer-events: none;
    }
    .search-field input {
      width: 100%; padding: 13px 16px 13px 44px;
      background: var(--surface3); border: none; border-radius: 8px;
      color: var(--text); font-size: 15px; font-family: inherit; outline: none;
      transition: background .15s;
    }
    .search-field input:focus { background: #333; }
    .search-field input::placeholder { color: var(--text3); }

    .clear-btn {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text2); cursor: pointer;
      display: none; font-size: 18px; padding: 4px;
    }

    /* Search categories */
    .categories-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    .cat-card {
      border-radius: 8px; overflow: hidden; padding: 14px;
      cursor: pointer; position: relative; height: 80px;
      display: flex; align-items: flex-end;
    }
    .cat-card span { font-size: 14px; font-weight: 700; z-index: 1; position: relative; }

    /* Search results */
    #search-results { display: none; }
    .result-row {
      display: flex; align-items: center; gap: 14px;
      padding: 10px 0; cursor: pointer; border-radius: 6px;
      transition: background .15s;
    }
    .result-row:active { background: rgba(255,255,255,.06); }
    .result-row img {
      width: 52px; height: 52px; border-radius: 4px;
      object-fit: cover; background: var(--surface3); flex-shrink: 0;
    }
    .result-info { flex: 1; min-width: 0; }
    .result-title {
      font-size: 14px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .result-artist {
      font-size: 12px; color: var(--text2);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .result-more {
      background: none; border: none; color: var(--text3);
      font-size: 20px; padding: 8px; cursor: pointer;
    }

    /* Loading spinner */
    .spinner {
      display: flex; justify-content: center; padding: 40px;
    }
    .spinner::after {
      content: ''; width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid var(--surface3); border-top-color: var(--green);
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ════════════════════════
       LIBRARY PAGE
    ════════════════════════ */
    #library-page { padding: 0 16px; display: none; }
    .library-top { padding: 52px 0 20px; }
    .library-top h2 { font-size: 22px; font-weight: 800; }
    .empty-library {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 60px 20px; text-align: center;
    }
    .empty-library svg { fill: var(--text3); margin-bottom: 16px; }
    .empty-library p { color: var(--text2); font-size: 14px; line-height: 1.5; }

    /* ════════════════════════
       MINI PLAYER
    ════════════════════════ */
    #mini-player {
      background: #1a1a1a;
      border-top: 1px solid rgba(255,255,255,.07);
      height: var(--player-h);
      display: none; align-items: center;
      padding: 0 16px; gap: 12px;
      position: relative;
    }
    #mini-player.show { display: flex; }

    #progress-bar {
      position: absolute; top: -1px; left: 0; width: 100%;
      height: 3px; -webkit-appearance: none; appearance: none;
      background: rgba(255,255,255,.15); border: none; outline: none; cursor: pointer;
    }
    #progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px;
      border-radius: 50%; background: var(--green); cursor: pointer;
    }
    #progress-bar::-moz-range-thumb {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--green); cursor: pointer; border: none;
    }

    #mini-thumb {
      width: 46px; height: 46px; border-radius: 4px;
      object-fit: cover; background: var(--surface3);
    }
    .mini-meta { flex: 1; min-width: 0; }
    .mini-title {
      font-size: 13px; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .mini-artist {
      font-size: 11px; color: var(--text2);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .mini-actions { display: flex; align-items: center; gap: 6px; }
    .icon-btn {
      background: none; border: none; color: var(--text);
      cursor: pointer; padding: 8px; display: flex;
      align-items: center; justify-content: center; border-radius: 50%;
      transition: background .15s;
    }
    .icon-btn:active { background: rgba(255,255,255,.1); }
    .icon-btn svg { fill: currentColor; }
    .icon-btn.green svg { fill: var(--green); }

    /* ════════════════════════
       BOTTOM NAV
    ════════════════════════ */
    #bottom-nav {
      background: rgba(10,10,10,.97);
      backdrop-filter: blur(12px);
      display: flex; justify-content: space-around; align-items: center;
      height: var(--nav-h);
      padding-bottom: env(safe-area-inset-bottom);
      border-top: 1px solid rgba(255,255,255,.05);
    }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      background: none; border: none; color: var(--text3);
      font-size: 10px; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: color .15s; padding: 6px 16px;
    }
    .nav-btn.active { color: var(--text); }
    .nav-btn svg { fill: currentColor; width: 22px; height: 22px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div id="bg-blur"></div>

<div id="app">
  <div id="content">

    <!-- ── HOME ── -->
    <div id="home-page">
      <div class="top-bar">
        <span class="greeting">Bonsoir 👋</span>
        <button class="avatar-btn">G</button>
      </div>

      <div class="chips">
        <button class="chip active" onclick="setChip(this,'all')">Tout</button>
        <button class="chip" onclick="setChip(this,'music')">Musique</button>
        <button class="chip" onclick="setChip(this,'podcasts')">Podcasts</button>
      </div>

      <div class="quick-picks" id="quick-picks">
        <!-- rempli dynamiquement -->
      </div>

      <div class="section-header">
        <span class="section-title">Tendances du moment</span>
      </div>
      <div class="h-scroll" id="trending-scroll">
        <!-- rempli dynamiquement -->
      </div>

      <div class="section-header" style="margin-top:8px">
        <span class="section-title">Recommandés pour vous</span>
      </div>
      <div class="h-scroll" id="recommended-scroll">
        <!-- rempli dynamiquement -->
      </div>
    </div>

    <!-- ── SEARCH ── -->
    <div id="search-page">
      <div class="search-top">
        <h2>Rechercher</h2>
        <div class="search-field">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="search-input" placeholder="Artistes, titres, albums…" autocomplete="off" autocorrect="off">
          <button class="clear-btn" id="clear-btn" onclick="clearSearch()">✕</button>
        </div>

        <div id="categories-section">
          <p style="font-size:13px;color:var(--text2);margin-bottom:14px;font-weight:600;">Parcourir les catégories</p>
          <div class="categories-grid">
            <div class="cat-card" style="background:linear-gradient(135deg,#e91e63,#9c27b0)" onclick="quickSearch('afrobeats')"><span>Afrobeats</span></div>
            <div class="cat-card" style="background:linear-gradient(135deg,#1565c0,#0d47a1)" onclick="quickSearch('hip hop')"><span>Hip-Hop</span></div>
            <div class="cat-card" style="background:linear-gradient(135deg,#2e7d32,#1b5e20)" onclick="quickSearch('amapiano')"><span>Amapiano</span></div>
            <div class="cat-card" style="background:linear-gradient(135deg,#e65100,#bf360c)" onclick="quickSearch('rnb soul')"><span>R&B / Soul</span></div>
            <div class="cat-card" style="background:linear-gradient(135deg,#4a148c,#6a1b9a)" onclick="quickSearch('rap français')"><span>Rap Français</span></div>
            <div class="cat-card" style="background:linear-gradient(135deg,#006064,#00838f)" onclick="quickSearch('coupé décalé')"><span>Coupé-Décalé</span></div>
          </div>
        </div>

        <div id="search-results"></div>
      </div>
    </div>

    <!-- ── LIBRARY ── -->
    <div id="library-page">
      <div class="library-top"><h2>Bibliothèque</h2></div>
      <div class="empty-library">
        <svg width="48" height="48" viewBox="0 0 24 24"><path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12zM4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm12 2.5V9h-3v2h3v2l2.5-2.5L16 8.5z"/></svg>
        <p>Les morceaux que tu joues<br>apparaîtront ici.</p>
      </div>
      <div id="library-list"></div>
    </div>

  </div>

  <!-- ── MINI PLAYER ── -->
  <div id="mini-player">
    <input type="range" id="progress-bar" min="0" max="100" value="0" step="0.1">
    <img id="mini-thumb" src="" alt="">
    <div class="mini-meta">
      <div class="mini-title" id="mini-title">—</div>
      <div class="mini-artist" id="mini-artist">—</div>
    </div>
    <div class="mini-actions">
      <button class="icon-btn" id="like-btn" onclick="toggleLike()">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/></svg>
      </button>
      <button class="icon-btn" id="play-btn" onclick="togglePlay()">
        <svg id="icon-play" width="28" height="28" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" width="28" height="28" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="icon-btn" onclick="playNext()">
        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg>
      </button>
    </div>
  </div>

  <!-- ── NAV ── -->
  <nav id="bottom-nav">
    <button class="nav-btn active" id="nav-home" onclick="navigate('home')">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Accueil
    </button>
    <button class="nav-btn" id="nav-search" onclick="navigate('search')">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      Rechercher
    </button>
    <button class="nav-btn" id="nav-library" onclick="navigate('library')">
      <svg viewBox="0 0 24 24"><path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12zM4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm12 2.5V9h-3v2h3v2l2.5-2.5L16 8.5z"/></svg>
      Bibliothèque
    </button>
  </nav>
</div>

<audio id="player-audio"></audio>

<script>
  // ── STATE ──
  let audio = document.getElementById('player-audio');
  let queue = [];
  let queueIndex = 0;
  let currentTrack = null;
  let isPlaying = false;
  let liked = new Set();
  let history = JSON.parse(localStorage.getItem('ghost_history') || '[]');

  // ── GREETING ──
  const hour = new Date().getHours();
  const greet = hour < 12 ? 'Bonjour 👋' : hour < 18 ? 'Bon après-midi 👋' : 'Bonsoir 👋';
  document.querySelector('.greeting').textContent = greet;

  // ── NAVIGATION ──
  function navigate(page) {
    ['home','search','library'].forEach(p => {
      document.getElementById(p + '-page').style.display = p === page ? 'block' : 'none';
      document.getElementById('nav-' + p).classList.toggle('active', p === page);
    });
    if (page === 'search') setTimeout(() => document.getElementById('search-input').focus(), 100);
  }

  // ── CHIPS ──
  function setChip(el, type) {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
  }

  // ── FETCH HELPERS ──
  async function fetchTracks(query) {
    const res = await fetch('/search?q=' + encodeURIComponent(query));
    if (!res.ok) throw new Error('fetch failed');
    return res.json();
  }

  function h(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── RENDER HELPERS ──
  function makeCard(track) {
    const d = document.createElement('div');
    d.className = 'music-card';
    d.innerHTML = `
      <img src="${h(track.thumbnail)}" alt="" loading="lazy"
           onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22140%22 height=%22140%22><rect width=%22140%22 height=%22140%22 fill=%22%23282828%22/></svg>'">
      <div class="card-title">${h(track.title)}</div>
      <div class="card-artist">${h(track.artist)}</div>`;
    d.onclick = () => startQueue([track], 0);
    return d;
  }

  function makeResultRow(track, idx, arr) {
    const d = document.createElement('div');
    d.className = 'result-row';
    d.innerHTML = `
      <img src="${h(track.thumbnail)}" alt="" loading="lazy"
           onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2252%22 height=%2252%22><rect width=%2252%22 height=%2252%22 fill=%22%23282828%22/></svg>'">
      <div class="result-info">
        <div class="result-title">${h(track.title)}</div>
        <div class="result-artist">${h(track.artist)}</div>
      </div>
      <button class="result-more">⋯</button>`;
    d.querySelector('.result-info').onclick = () => startQueue(arr, idx);
    d.querySelector('img').onclick = () => startQueue(arr, idx);
    return d;
  }

  function makeQuickPick(track) {
    const d = document.createElement('div');
    d.className = 'quick-pick';
    d.innerHTML = `
      <img src="${h(track.thumbnail)}" alt="" loading="lazy">
      <span class="quick-pick-title">${h(track.title)}</span>`;
    d.onclick = () => startQueue([track], 0);
    return d;
  }

  // ── INIT HOME ──
  async function initHome() {
    try {
      const [trending, recommended] = await Promise.all([
        fetchTracks('trending music 2025'),
        fetchTracks('best hits 2024 2025')
      ]);

      // Quick picks (first 4 of trending)
      const qp = document.getElementById('quick-picks');
      qp.innerHTML = '';
      trending.slice(0, 4).forEach(t => qp.appendChild(makeQuickPick(t)));

      // Trending scroll
      const ts = document.getElementById('trending-scroll');
      ts.innerHTML = '';
      trending.forEach(t => ts.appendChild(makeCard(t)));

      // Recommended scroll
      const rs = document.getElementById('recommended-scroll');
      rs.innerHTML = '';
      recommended.forEach(t => rs.appendChild(makeCard(t)));

      // Set bg from first track
      if (trending[0]) setBg(trending[0].thumbnail);
    } catch (e) {
      console.error('initHome error', e);
    }
  }

  // ── SEARCH ──
  let searchTimeout;
  const searchInput = document.getElementById('search-input');
  const clearBtn = document.getElementById('clear-btn');
  const categoriesSection = document.getElementById('categories-section');
  const searchResults = document.getElementById('search-results');

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim();
    clearBtn.style.display = q ? 'block' : 'none';
    if (!q) {
      categoriesSection.style.display = 'block';
      searchResults.style.display = 'none';
      searchResults.innerHTML = '';
      return;
    }
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => doSearch(q), 400);
  });

  async function doSearch(q) {
    categoriesSection.style.display = 'none';
    searchResults.style.display = 'block';
    searchResults.innerHTML = '<div class="spinner"></div>';
    try {
      const tracks = await fetchTracks(q);
      searchResults.innerHTML = '';
      if (!tracks.length) {
        searchResults.innerHTML = '<p style="color:var(--text2);text-align:center;padding:40px 0;">Aucun résultat</p>';
        return;
      }
      tracks.forEach((t, i) => searchResults.appendChild(makeResultRow(t, i, tracks)));
    } catch (e) {
      searchResults.innerHTML = '<p style="color:var(--text2);text-align:center;padding:40px 0;">Erreur de recherche</p>';
    }
  }

  function quickSearch(q) {
    navigate('search');
    searchInput.value = q;
    clearBtn.style.display = 'block';
    doSearch(q);
  }

  function clearSearch() {
    searchInput.value = '';
    clearBtn.style.display = 'none';
    categoriesSection.style.display = 'block';
    searchResults.style.display = 'none';
    searchResults.innerHTML = '';
    searchInput.focus();
  }

  // ── PLAYBACK ──
  function startQueue(tracks, idx) {
    queue = tracks;
    queueIndex = idx;
    playTrack(tracks[idx]);
  }

  function playTrack(track) {
    currentTrack = track;
    document.getElementById('mini-thumb').src = track.thumbnail;
    document.getElementById('mini-title').textContent = track.title;
    document.getElementById('mini-artist').textContent = track.artist;
    document.getElementById('mini-player').classList.add('show');
    setBg(track.thumbnail);

    audio.src = '/stream?id=' + track.id;
    audio.load();
    audio.play().then(() => { isPlaying = true; updateIcons(); }).catch(console.error);

    // Media Session
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: track.title, artist: track.artist,
        artwork: [{ src: track.thumbnail, sizes: '300x300', type: 'image/jpeg' }]
      });
      navigator.mediaSession.setActionHandler('play', () => { audio.play(); });
      navigator.mediaSession.setActionHandler('pause', () => { audio.pause(); });
      navigator.mediaSession.setActionHandler('nexttrack', playNext);
    }

    // History
    history = [track, ...history.filter(t => t.id !== track.id)].slice(0, 20);
    localStorage.setItem('ghost_history', JSON.stringify(history));
    updateLibrary();
  }

  function togglePlay() {
    if (!currentTrack) return;
    isPlaying ? audio.pause() : audio.play();
  }

  function playNext() {
    if (!queue.length) return;
    queueIndex = (queueIndex + 1) % queue.length;
    playTrack(queue[queueIndex]);
  }

  function toggleLike() {
    if (!currentTrack) return;
    const btn = document.getElementById('like-btn');
    if (liked.has(currentTrack.id)) {
      liked.delete(currentTrack.id);
      btn.classList.remove('green');
    } else {
      liked.add(currentTrack.id);
      btn.classList.add('green');
    }
  }

  audio.addEventListener('play', () => { isPlaying = true; updateIcons(); });
  audio.addEventListener('pause', () => { isPlaying = false; updateIcons(); });
  audio.addEventListener('ended', playNext);
  audio.addEventListener('timeupdate', () => {
    if (audio.duration) {
      document.getElementById('progress-bar').value = (audio.currentTime / audio.duration) * 100;
    }
  });

  document.getElementById('progress-bar').addEventListener('input', e => {
    if (audio.duration) audio.currentTime = (e.target.value / 100) * audio.duration;
  });

  function updateIcons() {
    document.getElementById('icon-play').style.display = isPlaying ? 'none' : 'block';
    document.getElementById('icon-pause').style.display = isPlaying ? 'block' : 'none';
  }

  function setBg(url) {
    document.getElementById('bg-blur').style.backgroundImage = `url(${url})`;
  }

  // ── LIBRARY ──
  function updateLibrary() {
    const list = document.getElementById('library-list');
    const empty = document.querySelector('.empty-library');
    if (!history.length) { list.innerHTML = ''; empty.style.display = 'flex'; return; }
    empty.style.display = 'none';
    list.innerHTML = '';
    history.forEach((t, i) => list.appendChild(makeResultRow(t, i, history)));
  }

  // ── START ──
  initHome();
  updateLibrary();
</script>
</body>
</html>
